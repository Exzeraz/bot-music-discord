[package]
name = "music-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "cache", "rustls_backend", "voice"] }
songbird = { version = "0.6", features = ["builtin-queue"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
regex = "1"
base64 = "0.22"
dotenvy = "0.15"
chrono = "0.4"
colored = "2"
rand = "0.8"
async-trait = "0.1"
symphonia = { version = "0.5.2", default-features = false, features = ["pcm"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
